<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>La Gastronomía en el Perú</title>
  <link rel="stylesheet" href="entregable.css">
</head>
<body>

  <main class="contenedor">

    <header class="encabezado">
      <h1>La Gastronomía en el Perú</h1>
    </header>

    <!-- Imagen principal -->
    <section class="portada">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQUPFS01I3g1nlWonlZQY_VaagZdfomhR09_Yk3i3jYNw&s=10" alt="">
    </section>

    <!-- Fecha y hora -->
    <section class="datos">
      <p class="etiqueta" id="pf">Fecha: ?</p>
      <p class="etiqueta" id="ph">Hora: ?</p>
    </section>

    <!-- Galería -->
    <section class="galeria">
      <figure>
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRViHA8H7FcIX59fdphYL4saUjQqdHidX_9LrZWf6UfXg&s=10" alt="">
      </figure>
      <figure>
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSpvBbPCYH9yg1D9ZpoQJNlbMhL5hV58q4zmy3hNAKftA&s=10" alt="">
      </figure>
    </section>

  </main>

  <!-- Ventana emergente -->
  <div id="ventana">
    <h1 id="h1ventana">Bienvenido</h1>
  </div>

  <script src="entregable.js"></script>
</body>
</html>
